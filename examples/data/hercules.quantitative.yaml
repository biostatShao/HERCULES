trait_name: synthetic_quantitative
chromosomes: ["22"]
base_ancestry: BASE
target_ancestry: TARGET

inputs:
  summary_statistics:
    base_path: examples/data/base.fastGWA.tsv
    target_path: examples/data/target.fastGWA.tsv
    base_columns: {}
    target_columns: {}
  functional_annotation: examples/data/functional_annotation.tsv
  per_snp_heritability: examples/data/per_snp_heritability.tsv
  ld_reference:
    base: examples/data/ld/base/chr_22
    target: examples/data/ld/target/chr_22
  genotype_prefixes:
    base_validation: examples/data/genotypes/base/base
  validation_genotype: examples/data/genotypes/target_validation/target_validation
  phenotype_file: ""
  target_validation_genotype: examples/data/genotypes/target_validation/target_validation
  target_validation_phenotype: examples/data/target.stage3.validation.tsv
  target_test_genotype: examples/data/genotypes/target_test/target_test
  target_test_phenotype: examples/data/target.stage3.test.tsv
  phenotype_column: phenotype
  covariates: [age, sex]
  trait_type: quantitative

output_dir: examples/output/quantitative
temporary_dir: examples/output/quantitative/tmp

tools:
  plink: plink
  plink2: plink2
  rscript: Rscript

execution:
  threads: 1
  parallel_jobs: 1
  seed: 7209

m1:
  hyperparameter_search: grid
  pi_steps: 10
  sigma_epsilon_steps: 10
  sumstats_format: fastgwa
  validation_keep: examples/data/target.stage3.validation.keep
  validation_phenotype: examples/data/target.stage3.validation.quantitative.pheno
m2:
  hyperparameter_search: grid
  pi_steps: 10
  sigma_epsilon_steps: 10
  sumstats_format: fastgwa
  validation_genotype: examples/data/genotypes/base/base
  validation_keep: examples/data/base.validation.keep
  validation_phenotype: examples/data/base.validation.quantitative.pheno
m3:
  model: directional_pairwise_uniform_lambda
  lambda_prior: uniform_0_1
  max_iter: 1000
  tol: 1.0e-6
  quadrature_points: 32
ensemble:
  quantitative_learners: [lasso, ridge, neural_network]
  binary_learners: [lasso, neural_network]
  binary_method: method.AUC
checkpoint:
  enabled: true
  resume: true
logging:
  level: INFO
  file: ""
